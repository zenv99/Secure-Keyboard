name: Secure Keyboard quality gates

on:
  workflow_dispatch:
  push:
    branches: [aster-development]
    paths:
      - 'aster-project/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/aster-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aster-project/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/aster-quality.yml'

permissions:
  contents: read

concurrency:
  group: aster-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aster-project/requirements-dev.txt
      - run: python -m pip install -r aster-project/requirements-dev.txt
      - run: PYTHONPATH=aster-project python -m unittest discover -s aster-project/tests -v
      - run: python aster-project/eval/autocorrect_eval.py aster-project/eval/sample_sentences.txt --seed 1

  android-build-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source privacy and backup declarations
        run: python3 aster-project/ci/check_privacy_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "${SDKMANAGER}" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "${sdk_status}" -ne 0 ]; then exit "${sdk_status}"; fi
          "${SDKMANAGER}" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.0.13004108'
      - name: Build, lint and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Enforce no-INTERNET permission in produced APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No debug APK produced; refusing to skip privacy gate.' >&2
            exit 1
          fi
          bash aster-project/ci/check_no_internet.sh "${apks[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
