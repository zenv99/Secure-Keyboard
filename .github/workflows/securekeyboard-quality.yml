name: Secure Keyboard quality gates

on:
  workflow_dispatch:
  push:
    branches: [main, 'securekeyboard-*']
    paths:
      - 'securekeyboard-project/**'
      - 'app/**'
      - 'asr/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/securekeyboard-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'securekeyboard-project/**'
      - 'app/**'
      - 'asr/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/securekeyboard-quality.yml'

permissions:
  contents: read

concurrency:
  group: securekeyboard-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: securekeyboard-project/requirements-dev.txt
      - run: python -m pip install -r securekeyboard-project/requirements-dev.txt
      - run: PYTHONPATH=securekeyboard-project python -m unittest discover -s securekeyboard-project/tests -v
      - run: python securekeyboard-project/eval/autocorrect_eval.py securekeyboard-project/eval/sample_sentences.txt --seed 1

  android-build-and-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to the 'test-build' pre-release on main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify source privacy and backup declarations
        run: python3 securekeyboard-project/ci/check_privacy_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "${SDKMANAGER}" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "${sdk_status}" -ne 0 ]; then exit "${sdk_status}"; fi
          "${SDKMANAGER}" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Cache on-device voice model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/asr
          key: asr-model-${{ hashFiles('securekeyboard-project/asr/MODEL_SHA256', 'securekeyboard-project/ci/fetch_model.sh') }}
      - name: Fetch and verify on-device voice model
        env:
          ALLOW_UNPINNED: '0' # the pin in securekeyboard-project/asr/MODEL_SHA256 is enforced
        run: bash securekeyboard-project/ci/fetch_model.sh
      - name: Unit tests (gate - release is not built or published if these fail)
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
      - name: Build debug APK
        env:
          SK_KEYSTORE_B64: ${{ secrets.SK_KEYSTORE_B64 }}
          SK_KEYSTORE_PASSWORD: ${{ secrets.SK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          PW="$(printf '%s' "${SK_KEYSTORE_PASSWORD:-}" | tr -d '[:space:]')"
          if [ -n "${SK_KEYSTORE_B64:-}" ] && printf '%s' "$SK_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/sk.jks" 2>/dev/null \
             && keytool -list -keystore "$RUNNER_TEMP/sk.jks" -storepass "$PW" -alias securekeyboard >/dev/null 2>&1; then
            export SK_KEYSTORE_FILE="$RUNNER_TEMP/sk.jks"
            export SK_KEYSTORE_PASSWORD="$PW"
            export SK_VERSION_CODE=$((4300 + GITHUB_RUN_NUMBER))
            export SK_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
            echo "SK_SIGNED=1" >> "$GITHUB_ENV"
            echo "Signing with the permanent Secure Keyboard key"
          else
            echo "::warning::Signing secrets missing or wrong (check SK_KEYSTORE_B64 / SK_KEYSTORE_PASSWORD). Building with the temporary debug key; updates will need uninstall."
          fi
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Enforce no-INTERNET permission in produced APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No release APK produced; refusing to skip privacy gate.' >&2
            exit 1
          fi
          bash securekeyboard-project/ci/check_no_internet.sh "${apks[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Record build info for the publish job
        run: |
          mkdir -p buildinfo
          echo "${SK_SIGNED:-0}" > buildinfo/signed
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-buildinfo
          path: buildinfo/signed

  emulator-smoke:
    # Runs the real keyboard on an Android emulator against a text field (mic visible, send arrow, hold backspace...).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "${SDKMANAGER}" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "${sdk_status}" -ne 0 ]; then exit "${sdk_status}"; fi
          "${SDKMANAGER}" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Cache on-device voice model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/asr
          key: asr-model-${{ hashFiles('securekeyboard-project/asr/MODEL_SHA256', 'securekeyboard-project/ci/fetch_model.sh') }}
      - name: Fetch and verify on-device voice model
        env:
          ALLOW_UNPINNED: '0'
        run: bash securekeyboard-project/ci/fetch_model.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keyboard smoke tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash securekeyboard-project/ci/emulator_smoke.sh
      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests
          if-no-files-found: ignore

  publish:
    # Only builds that passed the unit tests AND the emulator smoke tests are ever published.
    needs: [python-tests, android-build-and-privacy, emulator-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: secure-keyboard-release-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: secure-keyboard-buildinfo
          path: buildinfo

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          export GH_REPO="$GITHUB_REPOSITORY"
          cp apk/*.apk release/SecureKeyboard.apk
          (cd release && sha256sum SecureKeyboard.apk > SHA256SUMS.txt)
          cat > release/notes.md <<EOF
          Secure Keyboard v1.0 (commit ${GITHUB_SHA:0:8}). Not yet independently audited.

          This build passed the automated privacy gate: no INTERNET permission, backup disabled, only whitelisted permissions.
          Install: download SecureKeyboard.apk, allow installs from your browser or Files app when asked, then enable Secure Keyboard in Settings > System > Keyboard.
          Check the file against SHA256SUMS.txt before installing.
          EOF
          sed -i 's/^          //' release/notes.md
          if [ "$(cat buildinfo/signed)" = "1" ]; then
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
            cp release/SecureKeyboard.apk "release/SecureKeyboard-${TAG}.apk"
            gh release create "$TAG" "release/SecureKeyboard-${TAG}.apk" release/SHA256SUMS.txt \
              --prerelease --target "$GITHUB_SHA" --title "Secure Keyboard ${TAG}" --notes-file release/notes.md
          fi
          # The old rolling 'test-build' release is gone: its non-version tag confused Obtainium's update check.
          gh release delete test-build --cleanup-tag --yes || true
