name: Secure Keyboard quality gates

on:
  workflow_dispatch:
  push:
    branches: [main, 'securekeyboard-*']
    paths:
      - 'securekeyboard-project/**'
      - 'app/**'
      - 'asr/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/securekeyboard-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'securekeyboard-project/**'
      - 'app/**'
      - 'asr/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/securekeyboard-quality.yml'

permissions:
  contents: read

concurrency:
  group: securekeyboard-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: securekeyboard-project/requirements-dev.txt
      - run: python -m pip install -r securekeyboard-project/requirements-dev.txt
      - run: PYTHONPATH=securekeyboard-project python -m unittest discover -s securekeyboard-project/tests -v
      - run: python securekeyboard-project/eval/autocorrect_eval.py securekeyboard-project/eval/sample_sentences.txt --seed 1

  android-build-and-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to the 'test-build' pre-release on main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify source privacy and backup declarations
        run: python3 securekeyboard-project/ci/check_privacy_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "${SDKMANAGER}" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "${sdk_status}" -ne 0 ]; then exit "${sdk_status}"; fi
          "${SDKMANAGER}" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Cache on-device voice model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/asr
          key: asr-model-${{ hashFiles('securekeyboard-project/asr/MODEL_SHA256', 'securekeyboard-project/ci/fetch_model.sh') }}
      - name: Fetch and verify on-device voice model
        env:
          ALLOW_UNPINNED: '0' # the pin in securekeyboard-project/asr/MODEL_SHA256 is enforced
        run: bash securekeyboard-project/ci/fetch_model.sh
      - name: Unit tests (gate - release is not built or published if these fail)
        timeout-minutes: 35
        run: |
          chmod +x ./gradlew
          # Robolectric fetches its android-all jar at test start and sometimes gets a 404.
          # A real assertion failure fails again. A missed download usually succeeds on the retry.
          ./gradlew --no-daemon :app:testDebugUnitTest || ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
      - name: Build debug APK
        env:
          SK_KEYSTORE_B64: ${{ secrets.SK_KEYSTORE_B64 }}
          SK_KEYSTORE_PASSWORD: ${{ secrets.SK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          PW="$(printf '%s' "${SK_KEYSTORE_PASSWORD:-}" | tr -d '[:space:]')"
          if [ -n "${SK_KEYSTORE_B64:-}" ] && printf '%s' "$SK_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/sk.jks" 2>/dev/null \
             && keytool -list -keystore "$RUNNER_TEMP/sk.jks" -storepass "$PW" -alias securekeyboard >/dev/null 2>&1; then
            export SK_KEYSTORE_FILE="$RUNNER_TEMP/sk.jks"
            export SK_KEYSTORE_PASSWORD="$PW"
            export SK_VERSION_CODE=$((4300 + GITHUB_RUN_NUMBER))
            # Published v1.0.3 is versionCode 4408. Stay above it so Obtainium and Android see an update.
            if [ "$SK_VERSION_CODE" -le 4408 ]; then
              export SK_VERSION_CODE=4409
            fi
            # New release. Do not replace v1.0.3 or any older release.
            export SK_VERSION_NAME="1.0.4"
            echo "SK_SIGNED=1" >> "$GITHUB_ENV"
            echo "SK_VERSION_NAME=$SK_VERSION_NAME" >> "$GITHUB_ENV"
            echo "SK_VERSION_CODE=$SK_VERSION_CODE" >> "$GITHUB_ENV"
            echo "Signing with the permanent Secure Keyboard key"
          else
            echo "Release signing key is missing or wrong. Refusing to build a debug-signed release." >&2
            exit 1
          fi
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Enforce no-INTERNET permission in produced APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No release APK produced; refusing to skip privacy gate.' >&2
            exit 1
          fi
          bash securekeyboard-project/ci/check_no_internet.sh "${apks[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Record build info for the publish job
        run: |
          mkdir -p buildinfo
          echo "${SK_SIGNED:-0}" > buildinfo/signed
          echo "${SK_VERSION_NAME:-}" > buildinfo/version_name
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-buildinfo
          path: buildinfo/signed
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-version
          path: buildinfo/version_name

  emulator-smoke:
    # Runs the real keyboard on an Android emulator against a text field (mic visible, send arrow, hold backspace...).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "${SDKMANAGER}" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "${sdk_status}" -ne 0 ]; then exit "${sdk_status}"; fi
          "${SDKMANAGER}" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Cache on-device voice model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/asr
          key: asr-model-${{ hashFiles('securekeyboard-project/asr/MODEL_SHA256', 'securekeyboard-project/ci/fetch_model.sh') }}
      - name: Fetch and verify on-device voice model
        env:
          ALLOW_UNPINNED: '0'
        run: bash securekeyboard-project/ci/fetch_model.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keyboard smoke tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash securekeyboard-project/ci/emulator_smoke.sh
      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests
          if-no-files-found: ignore

  publish:
    # Only builds that passed the unit tests AND the emulator smoke tests are ever published.
    needs: [python-tests, android-build-and-privacy, emulator-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: secure-keyboard-release-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: secure-keyboard-buildinfo
          path: buildinfo
      - uses: actions/download-artifact@v4
        with:
          name: secure-keyboard-version
          path: buildinfo

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          export GH_REPO="$GITHUB_REPOSITORY"
          cp apk/*.apk release/SecureKeyboard.apk
          VERSION_NAME="$(tr -d '[:space:]' < buildinfo/version_name || true)"
          if [ "$VERSION_NAME" = "1.0" ] || [ "$VERSION_NAME" = "1.0.1" ] || [ "$VERSION_NAME" = "1.0.2" ] || [ "$VERSION_NAME" = "1.0.3" ] || [ "$VERSION_NAME" = "1.0.4" ]; then
            TAG="v${VERSION_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          cp release/SecureKeyboard.apk "release/SecureKeyboard-${TAG}.apk"
          (cd release && sha256sum "SecureKeyboard-${TAG}.apk" > SHA256SUMS.txt)
          if [ "$TAG" = "v1.0.4" ]; then
            cat > release/notes.md <<EOF
          Secure Keyboard v1.0.4 (commit ${GITHUB_SHA:0:8}). Not yet independently audited.

          What changed
          - Hold the big button to dictate. Release transcribes on the device and leaves the text in the field. The keyboard stays open.
          - A short tap sends once the field has text. A hold appends more dictation and does not send.

          Privacy
          No INTERNET permission. No background location. Backup is off. Voice and learned words stay on the device.

          License
          Secure Keyboard is free software under the GNU General Public License v3.0. It is a modified version of HeliBoard (copyright Helium314 and contributors), which is based on OpenBoard and the Android Open Source Keyboard (Apache License 2.0). This is not the official HeliBoard.

          Signing certificate SHA-256
          33eacd63355ee1b19abca1f997ea25a7946960bbf934411691273dde053c78d4

          Install: download SecureKeyboard-v1.0.4.apk, then enable Secure Keyboard in Settings > System > Keyboard. Check the file against SHA256SUMS.txt before installing.
          EOF
          elif [ "$TAG" = "v1.0.3" ]; then
            cat > release/notes.md <<EOF
          Secure Keyboard v1.0.3 (commit ${GITHUB_SHA:0:8}). Not yet independently audited.

          What changed
          - After you type, the big button sends. After dictation finishes and sends, the keyboard stays open.
          - ill becomes I'll unless the previous word is calling someone sick. Learning stays on the device.

          Privacy
          No INTERNET permission. No background location. Backup is off. Voice and learned words stay on the device.

          License
          Secure Keyboard is free software under the GNU General Public License v3.0. It is a modified version of HeliBoard (copyright Helium314 and contributors), which is based on OpenBoard and the Android Open Source Keyboard (Apache License 2.0). This is not the official HeliBoard.

          Signing certificate SHA-256
          33eacd63355ee1b19abca1f997ea25a7946960bbf934411691273dde053c78d4

          Install: download SecureKeyboard-v1.0.3.apk, then enable Secure Keyboard in Settings > System > Keyboard. Check the file against SHA256SUMS.txt before installing.
          EOF
          elif [ "$TAG" = "v1.0.2" ]; then
            cat > release/notes.md <<EOF
          Secure Keyboard v1.0.2 (commit ${GITHUB_SHA:0:8}). Not yet independently audited.

          What changed
          - Autocorrect fixes neighboring-key slips and run-on words on space (hwllo to hello, iamgoing to I am going, whatbtime to what time). A real word or name is left alone.
          - Dictation can be used again after it finishes, and then performs the field's send action. It does not insert a newline.
          - The plus menu is Photos, Camera, Location, Document, Contact, Emoji, Clipboard, Text shortcuts, and Settings. Location is requested only when tapped, takes one fix, and inserts a maps link as text. It is not stored.
          - Version bump to 1.0.2 so updaters detect it.

          Privacy
          No INTERNET permission. No background location. Backup is off. Voice, the location fix, and learned words stay on the device.

          License
          Secure Keyboard is free software under the GNU General Public License v3.0. It is a modified version of HeliBoard (copyright Helium314 and contributors), which is based on OpenBoard and the Android Open Source Keyboard (Apache License 2.0). This is not the official HeliBoard.

          Signing certificate SHA-256
          33eacd63355ee1b19abca1f997ea25a7946960bbf934411691273dde053c78d4

          Install: download SecureKeyboard-v1.0.2.apk, then enable Secure Keyboard in Settings > System > Keyboard. Check the file against SHA256SUMS.txt before installing.
          EOF
          elif [ "$TAG" = "v1.0.1" ]; then
            cat > release/notes.md <<EOF
          Secure Keyboard v1.0.1 (commit ${GITHUB_SHA:0:8}). Not yet independently audited.

          What changed
          - Autocorrect fixes neighboring-key slips and run-on words on space (hwllo to hello, iamgoing to I am going, whatbtime to what time). A real word or name is left alone.
          - Dictation can be used again after it finishes, and then performs the field's send action. It does not insert a newline.
          - The plus menu is Photos, Camera, Location, Document, Contact, Emoji, Clipboard, Text shortcuts, and Settings. Location is requested only when tapped, takes one fix, and inserts a maps link as text. It is not stored.

          Privacy
          No INTERNET permission. No background location. Backup is off. Voice, the location fix, and learned words stay on the device.

          License
          Secure Keyboard is free software under the GNU General Public License v3.0. It is a modified version of HeliBoard (copyright Helium314 and contributors), which is based on OpenBoard and the Android Open Source Keyboard (Apache License 2.0). This is not the official HeliBoard.

          Signing certificate SHA-256
          33eacd63355ee1b19abca1f997ea25a7946960bbf934411691273dde053c78d4

          Install: download SecureKeyboard-v1.0.1.apk, then enable Secure Keyboard in Settings > System > Keyboard. Check the file against SHA256SUMS.txt before installing.
          EOF
          elif [ "$TAG" = "v1.0" ]; then
            cat > release/notes.md <<EOF
          Secure Keyboard v1.0 (commit ${GITHUB_SHA:0:8}). Not yet independently audited.

          What changed
          - Suggestions: emoji for a word such as sun are ranked from Unicode CLDR annotations, with the color emoji near the top.
          - Dictation stays on the device. Releasing the mic keeps a short tail of audio, and a long hold is transcribed in overlapping pieces so the end of the sentence is not dropped.
          - Typing: a period is inserted only for a quick double space, within 300 ms, and not in a URL, email, or search field.
          - The space bar tracks the finger. Small jitter does not move the caret. A slow drag moves about one character per 10 dp, and changing lines takes a larger movement.
          - The big button is the microphone when the field is empty, and Send once you type or dictate. It performs the field's send action in a multi-line chat, including when the app sets actionNone. It does not insert a newline.
          - The keyboard and the plus menu follow the light and dark system theme, with the usual chat tools: emoji, clipboard, text replacement, settings, languages, one-handed mode, undo, redo, select all, copy, and paste.

          Privacy
          This build passed the automated privacy gate: no INTERNET permission, backup disabled, only the allowlisted permissions. Voice audio and recognition stay on the device.

          License
          Secure Keyboard is free software under the GNU General Public License v3.0. It is a modified version of HeliBoard (copyright Helium314 and contributors), which is based on OpenBoard and the Android Open Source Keyboard (Apache License 2.0). This is not the official HeliBoard.

          Signing certificate SHA-256
          33eacd63355ee1b19abca1f997ea25a7946960bbf934411691273dde053c78d4

          Install: download SecureKeyboard-v1.0.apk, then enable Secure Keyboard in Settings > System > Keyboard. Check the file against SHA256SUMS.txt before installing.
          EOF
          else
            cat > release/notes.md <<EOF
          Secure Keyboard ${TAG} (commit ${GITHUB_SHA:0:8}). Not yet independently audited.

          This build passed the automated privacy gate: no INTERNET permission, backup disabled, only the allowlisted permissions.
          Install: download SecureKeyboard-${TAG}.apk, then enable Secure Keyboard in Settings > System > Keyboard. Check the file against SHA256SUMS.txt before installing.
          EOF
          fi
          sed -i 's/^          //' release/notes.md
          if [ "$(cat buildinfo/signed)" != "1" ]; then
            echo "Refusing to publish: the APK was not signed with the release key." >&2
            exit 1
          fi
          cp release/SecureKeyboard.apk "release/SecureKeyboard-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing release $TAG." >&2
            exit 1
          fi
          # v1.0.4 is a full release. Older tags stay pre-releases and are never replaced.
          if [ "$TAG" = "v1.0.4" ]; then
            gh release create "$TAG" "release/SecureKeyboard-${TAG}.apk" release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Secure Keyboard ${TAG}" --notes-file release/notes.md
          else
            gh release create "$TAG" "release/SecureKeyboard-${TAG}.apk" release/SHA256SUMS.txt \
              --prerelease --target "$GITHUB_SHA" --title "Secure Keyboard ${TAG}" --notes-file release/notes.md
          fi
