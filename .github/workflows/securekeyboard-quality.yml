name: Secure Keyboard quality gates

on:
  workflow_dispatch:
  push:
    branches: [main, 'securekeyboard-*']
    paths:
      - 'securekeyboard-project/**'
      - 'app/**'
      - 'asr/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/securekeyboard-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'securekeyboard-project/**'
      - 'app/**'
      - 'asr/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/securekeyboard-quality.yml'

permissions:
  contents: read

concurrency:
  group: securekeyboard-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: securekeyboard-project/requirements-dev.txt
      - run: python -m pip install -r securekeyboard-project/requirements-dev.txt
      - run: PYTHONPATH=securekeyboard-project python -m unittest discover -s securekeyboard-project/tests -v
      - run: python securekeyboard-project/eval/autocorrect_eval.py securekeyboard-project/eval/sample_sentences.txt --seed 1

  android-build-and-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to the 'test-build' pre-release on main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify source privacy and backup declarations
        run: python3 securekeyboard-project/ci/check_privacy_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "${SDKMANAGER}" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "${sdk_status}" -ne 0 ]; then exit "${sdk_status}"; fi
          "${SDKMANAGER}" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Cache on-device voice model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/asr
          key: asr-model-${{ hashFiles('securekeyboard-project/asr/MODEL_SHA256', 'securekeyboard-project/ci/fetch_model.sh') }}
      - name: Fetch and verify on-device voice model
        env:
          ALLOW_UNPINNED: '0' # the pin in securekeyboard-project/asr/MODEL_SHA256 is enforced
        run: bash securekeyboard-project/ci/fetch_model.sh
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Enforce no-INTERNET permission in produced APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No debug APK produced; refusing to skip privacy gate.' >&2
            exit 1
          fi
          bash securekeyboard-project/ci/check_no_internet.sh "${apks[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish test-build pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/SecureKeyboard-debug.apk
          (cd release && sha256sum SecureKeyboard-debug.apk > SHA256SUMS.txt)
          cat > release/notes.md <<EOF
          Test build of Secure Keyboard (commit ${GITHUB_SHA:0:8}). Debug-signed, not yet independently audited.

          This build passed the automated privacy gate: no INTERNET permission, backup disabled, only whitelisted permissions.
          Install: download SecureKeyboard-debug.apk, allow installs from your browser or Files app when asked, then enable Secure Keyboard in Settings > System > Keyboard.
          Check the file against SHA256SUMS.txt before installing.
          EOF
          sed -i 's/^          //' release/notes.md
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build release/SecureKeyboard-debug.apk release/SHA256SUMS.txt \
            --prerelease --target "$GITHUB_SHA" --title "Secure Keyboard test build" --notes-file release/notes.md
