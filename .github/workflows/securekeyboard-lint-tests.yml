name: Secure Keyboard lint and unit tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'securekeyboard-project/**'
      - 'app/**'
      - 'asr/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/securekeyboard-lint-tests.yml'

permissions:
  contents: read

concurrency:
  group: securekeyboard-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify source privacy and backup declarations
        run: python3 securekeyboard-project/ci/check_privacy_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "${SDKMANAGER}" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "${sdk_status}" -ne 0 ]; then exit "${sdk_status}"; fi
          "${SDKMANAGER}" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Cache on-device voice model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/asr
          key: asr-model-${{ hashFiles('securekeyboard-project/asr/MODEL_SHA256', 'securekeyboard-project/ci/fetch_model.sh') }}
      - name: Fetch and verify on-device voice model
        env:
          ALLOW_UNPINNED: '0' # the pin in securekeyboard-project/asr/MODEL_SHA256 is enforced
        run: bash securekeyboard-project/ci/fetch_model.sh
      - name: Run unit tests
        timeout-minutes: 25
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --continue
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
